<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      line-height: 1.6;
    }

    #root {
      min-height: 100vh;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 300px;
      background: #1a1a1a;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #fff;
    }

    .audit-list {
      list-style: none;
    }

    .audit-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #252525;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .audit-item:hover {
      background: #2a2a2a;
      border-color: #444;
    }

    .audit-item.active {
      background: #2d4a7c;
      border-color: #4a7ac9;
    }

    .audit-hash {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #888;
    }

    .audit-date {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 40px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
    }

    .error {
      background: #5c1919;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #8b2e2e;
    }

    .message-block {
      margin-bottom: 30px;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
      border-left: 4px solid #444;
    }

    .message-block.system {
      border-left-color: #7c2d87;
      background: #1f1a21;
    }

    .message-block.user {
      border-left-color: #4a7ac9;
      background: #1a2133;
    }

    .message-block.assistant {
      border-left-color: #2d8b57;
      background: #1a2520;
    }

    .message-block.function {
      border-left-color: #c97a4a;
      background: #2b2119;
    }

    .message-type {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      opacity: 0.7;
    }

    .message-content {
      line-height: 1.7;
    }

    .markdown {
      color: #e0e0e0;
    }

    .markdown h1, .markdown h2, .markdown h3 {
      margin-top: 24px;
      margin-bottom: 12px;
      color: #fff;
    }

    .markdown h1 {
      font-size: 28px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .markdown h2 {
      font-size: 22px;
    }

    .markdown h3 {
      font-size: 18px;
    }

    .markdown p {
      margin-bottom: 12px;
    }

    .markdown code {
      background: #0a0a0a;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      color: #ff6b6b;
    }

    .markdown pre {
      background: #0a0a0a;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid #222;
    }

    .markdown pre code {
      background: none;
      padding: 0;
      color: #e0e0e0;
    }

    .markdown ul, .markdown ol {
      margin-left: 24px;
      margin-bottom: 12px;
    }

    .markdown li {
      margin-bottom: 6px;
    }

    .markdown blockquote {
      border-left: 3px solid #555;
      padding-left: 16px;
      margin: 16px 0;
      color: #aaa;
    }

    .markdown a {
      color: #6ba3ff;
      text-decoration: none;
    }

    .markdown a:hover {
      text-decoration: underline;
    }

    .markdown table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
    }

    .markdown th, .markdown td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown th {
      background: #252525;
      font-weight: 600;
    }

    .json-block {
      background: #0a0a0a;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 12px;
      border: 1px solid #222;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.tsx"></script>
</body>
</html>
